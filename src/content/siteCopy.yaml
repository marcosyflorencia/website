faq:
  - question: What tango styles are there?
    answer: |
      Argentine tango has several approaches, with plenty of overlap between them:

      Tango salón: Social tango danced at milongas, emphasizing connection, musicality, and moving comfortably around a shared dance floor.

      Milonguero style: Usually danced in a close embrace with compact movements, especially suited to a crowded floor.

      Tango nuevo: An exploratory approach that plays with movement, space, and changes in the embrace.

      Stage tango: Choreographed for an audience, often featuring dramatic movements, lifts, and theatrical expression.

      You may also hear about vals and milonga. These are related musical and dance forms enjoyed alongside tango: vals has a lilting three-beat rhythm, while milonga often has a brisk, playful feel.


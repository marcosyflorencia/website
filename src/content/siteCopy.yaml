introduction:
  about:
    title: About Us
    chapters:
      - title: ""
        body: |
          Born in Argentina, the birthplace of tango, Marcos and Florencia have studied with maestros and milongueros since their teenage years.

      - title: Buenos Aires Recognition 2015
        body: |
          Their partnership quickly earned recognition in tango’s birthplace. In 2015, they placed 2nd in the Buenos Aires City Tango Championship, one of the world’s most respected tango competitions.

      - title: "World Championship Finalists: 2017–2023"
        body: |
          Over the years, Marcos and Florencia have carried Argentine tango across the world, teaching and performing at major festivals, cultural events, and stage productions. They have been finalists many times in the World Tango Championship’s Tango de Pista (Salon) category.

      - title: Present, New York
        body: |
          New York City is now their home. They share Argentine tango with an international audience in New York. In 2025, their dedication was recognized by the U.S. Congress and the Argentine Civic Committee.

